<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A simple local Todo app">
    <title>Todo</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">LOCAL TASKS</p>
          <h1>Todo</h1>
        </div>
        <button id="quickAddButton" class="button button-primary" type="button">+ Add task</button>
      </header>

      <main class="layout">
        <aside class="sidebar panel">
          <section>
            <p class="section-label">View</p>
            <nav id="filterNav" class="filter-list" aria-label="Task filters">
              <button class="filter-button is-active" data-filter="all">All <span></span></button>
              <button class="filter-button" data-filter="active">Active <span></span></button>
              <button class="filter-button" data-filter="today">Today <span></span></button>
              <button class="filter-button" data-filter="overdue">Overdue <span></span></button>
              <button class="filter-button" data-filter="completed">Completed <span></span></button>
            </nav>
          </section>

          <section class="stats">
            <p class="section-label">Overview</p>
            <div class="stat-grid">
              <div class="stat"><strong id="statTotal">0</strong><span>Total</span></div>
              <div class="stat"><strong id="statActive">0</strong><span>Active</span></div>
              <div class="stat"><strong id="statDone">0</strong><span>Done</span></div>
              <div class="stat"><strong id="statOverdue">0</strong><span>Overdue</span></div>
            </div>
          </section>

          <section class="tips">
            <p class="section-label">Shortcuts</p>
            <p><kbd>N</kbd> new task</p>
            <p><kbd>/</kbd> focus search</p>
            <p><kbd>Esc</kbd> close dialog</p>
          </section>
        </aside>

        <section class="content">
          <div class="toolbar panel">
            <label class="search-box">
              <span aria-hidden="true">⌕</span>
              <input id="searchInput" type="search" placeholder="Search title, notes or tags" autocomplete="off">
            </label>
            <label class="sort-box">
              <span>Sort</span>
              <select id="sortSelect">
                <option value="updated">Recently updated</option>
                <option value="created">Recently created</option>
                <option value="due">Due date</option>
                <option value="priority">Priority</option>
                <option value="title">Title</option>
              </select>
            </label>
          </div>

          <div id="selectionBar" class="selection-bar panel hidden">
            <strong><span id="selectedCount">0</span> selected</strong>
            <div class="selection-actions">
              <button id="completeSelected" class="button" type="button">Mark done</button>
              <button id="deleteSelected" class="button button-danger" type="button">Delete</button>
            </div>
          </div>

          <section id="todoList" class="todo-list" aria-live="polite"></section>

          <div id="emptyState" class="empty-state panel hidden">
            <div class="empty-icon">✓</div>
            <h2 id="emptyTitle">No tasks</h2>
            <p id="emptyText">Add something you want to remember.</p>
            <button id="emptyAdd" class="button button-primary" type="button">Create a task</button>
          </div>

          <footer class="content-footer">
            <button id="clearCompleted" class="text-button" type="button">Clear completed</button>
          </footer>
        </section>
      </main>
    </div>

    <dialog id="todoDialog" class="dialog">
      <form id="todoForm" method="dialog" class="dialog-card">
        <div class="dialog-header">
          <div>
            <p class="section-label">Task</p>
            <h2 id="dialogTitle">Add task</h2>
          </div>
          <button id="closeDialog" class="icon-button" type="button" aria-label="Close">×</button>
        </div>

        <input id="todoId" type="hidden">

        <label class="field">
          <span>Title</span>
          <input id="titleInput" name="title" maxlength="160" required placeholder="What needs to be done?">
        </label>

        <label class="field">
          <span>Notes</span>
          <textarea id="notesInput" name="notes" maxlength="2000" rows="4" placeholder="Optional details"></textarea>
        </label>

        <div class="field-row">
          <label class="field">
            <span>Priority</span>
            <select id="priorityInput">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </label>

          <label class="field">
            <span>Due date</span>
            <input id="dueDateInput" type="date">
          </label>
        </div>

        <label class="field">
          <span>Tags <small>comma separated</small></span>
          <input id="tagsInput" maxlength="320" placeholder="work, personal, errands">
        </label>

        <div class="dialog-actions">
          <button id="deleteDialogButton" class="button button-danger hidden" type="button">Delete</button>
          <div class="spacer"></div>
          <button id="cancelDialog" class="button" type="button">Cancel</button>
          <button class="button button-primary" type="submit">Save task</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
